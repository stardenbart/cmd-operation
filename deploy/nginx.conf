# FM Receiving — Nginx on-prem (NFR-16)
# Klien statis disajikan dari origin yang sama dengan API, sehingga tidak
# diperlukan CORS di produksi.

server {
    # HTTP dipertahankan untuk akses intranet mengikuti pola layanan IGMP.
    # HTTPS tetap tersedia sebagai opsi akses terenkripsi.
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name fm.cmd1.local _;

    # Sertifikat internal pabrik atau CA internal (NFR-16)
    ssl_certificate     /etc/nginx/certs/fm.crt;
    ssl_certificate_key /etc/nginx/certs/fm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # NFR-13: seluruh aset disajikan lokal. Tidak ada CDN, tidak ada font
    # eksternal — aplikasi harus tetap jalan saat internet pabrik putus.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;

    # --- Kompresi ---
    #
    # Respons JSON aplikasi ini sangat dapat dimampatkan: payload analitik
    # sebulan berukuran ~118 KB mentah dan menyusut sekitar 85% setelah gzip.
    # Pada dashboard yang menyegar tiap 30 detik dari banyak perangkat di
    # jaringan pabrik, selisih itu berlipat ganda sepanjang shift.
    #
    # gzip, bukan brotli: brotli menuntut modul tambahan yang belum tentu ada
    # di image nginx standar, sedangkan gzip selalu ada. Selisih rasionya kecil
    # untuk JSON, dan yang dikejar di sini keandalan, bukan rasio terakhir.
    gzip on;
    gzip_vary on;              # beri tahu cache di tengah bahwa isi bergantung Accept-Encoding
    gzip_proxied any;          # mampatkan juga respons yang datang dari proxy_pass
    gzip_min_length 1024;      # di bawah 1 KB, ongkos header gzip lebih besar dari hematnya
    gzip_comp_level 5;         # cukup tinggi untuk JSON, cukup rendah agar CPU tidak jadi hambatan
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        image/svg+xml;
    # Berkas .xlsx TIDAK dimampatkan: formatnya sudah zip, jadi gzip di atasnya
    # hanya membuang CPU tanpa memperkecil apa pun.

    # --- Klien React ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Aset ber-hash boleh di-cache lama; index.html tidak.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API ---
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Export form GMP untuk rentang bulanan dapat berjalan lama
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://server:3000/health;
        access_log off;
    }
}
